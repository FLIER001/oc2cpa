# Multi-arch build & release for the oc2api CLIProxyAPI plugin (Go c-shared port
# of the original Node.js proxy).
#
#   - tag 'v*'          → release that version (the official CLIProxyAPI plugin
#                         store requires the release tag to be v<version>)
#   - workflow_dispatch → pick a version manually
#   - plain push/PR     → CI builds + tests only (artifacts, no release)
#
# Asset naming matches CLIProxyAPI pluginstore ArchiveName():
#   <id>_<version>_<goos>_<goarch>.zip   (zip root: <id>.so|.dylib|.dll)

name: Build

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Version without v (empty = the plugin's VERSION file)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: oc2api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: oc2api/go.mod
          cache-dependency-path: oc2api/go.sum
      - name: Validate registry.json
        working-directory: .
        run: python3 .github/scripts/validate-registry.py registry.json
      - name: Check formatting
        run: |
          test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...

  build:
    name: oc2api ${{ matrix.goos }}/${{ matrix.goarch }}
    needs: test
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            runner: ubuntu-24.04
            ext: so
          - goos: linux
            goarch: arm64
            runner: ubuntu-24.04-arm
            ext: so
          - goos: darwin
            goarch: amd64
            runner: macos-15-intel
            ext: dylib
          - goos: darwin
            goarch: arm64
            runner: macos-15
            ext: dylib
          - goos: windows
            goarch: amd64
            runner: windows-2025
            ext: dll
    defaults:
      run:
        shell: bash
        working-directory: oc2api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: oc2api/go.mod
          cache-dependency-path: oc2api/go.sum

      - name: Resolve release metadata
        run: |
          set -euo pipefail
          # Version resolution: this plugin's tag > dispatch input > VERSION file
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < VERSION)"
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "LIB_NAME=oc2api.${{ matrix.ext }}" >> "${GITHUB_ENV}"
          echo "ARCHIVE_NAME=oc2api_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION} archive=oc2api_${CLEAN_VERSION}_${{ matrix.goos }}_${{ matrix.goarch }}.zip"

      - name: Build shared library
        env:
          # Pin the deployment target: clang defaults it to the runner's macOS
          # version, which would ship dylibs declaring a minos newer than the
          # oldest supported systems.
          MACOSX_DEPLOYMENT_TARGET: ${{ matrix.goos == 'darwin' && '11.0' || '' }}
          # Keep dylibs/dlls from stealing runtime state during host teardown.
          GOFLAGS: -trimpath
        run: |
          set -euo pipefail
          mkdir -p dist
          CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -buildmode=c-shared \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/${LIB_NAME}" .
          rm -f dist/*.h || true
          file "dist/${LIB_NAME}" || true

      - name: Verify darwin deployment target and ABI exports
        if: matrix.goos == 'darwin'
        run: python3 ../.github/scripts/check-darwin-dylib.py "dist/${LIB_NAME}"

      - name: Package plugin (CPA ArchiveName)
        working-directory: .
        run: |
          set -euo pipefail
          go run ./.github/scripts/package-release.go \
            -library "oc2api/dist/${LIB_NAME}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"
          python3 - <<'PY'
          import zipfile, os, sys
          name = os.environ["ARCHIVE_NAME"]
          lib = os.environ["LIB_NAME"]
          with zipfile.ZipFile(name) as z:
              names = z.namelist()
              print("zip entries:", names)
              if lib not in names:
                  sys.exit(f"zip root missing {lib}: {names}")
          PY

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  build-cross:
    name: oc2api ${{ matrix.target }} (go-cross)
    needs: test
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-arm64
            ext: dll
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: oc2api/go.mod
          cache-dependency-path: oc2api/go.sum

      - name: Resolve release metadata
        id: meta
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="$(tr -d ' \n\r' < oc2api/VERSION)"
          fi
          CLEAN_VERSION="${VERSION%%+*}"
          GOOS_PART="${{ matrix.target }}"
          echo "VERSION=${CLEAN_VERSION}" >> "${GITHUB_ENV}"
          echo "version=${CLEAN_VERSION}" >> "${GITHUB_OUTPUT}"
          echo "ARCHIVE_NAME=oc2api_${CLEAN_VERSION}_${GOOS_PART%-*}_${GOOS_PART#*-}.zip" >> "${GITHUB_ENV}"
          echo "LIB_NAME=oc2api.${{ matrix.ext }}" >> "${GITHUB_ENV}"

      - name: Build cross shared library
        timeout-minutes: 45
        uses: go-cross/cgo-actions@v1
        env:
          GOFLAGS: -trimpath -buildmode=c-shared
        with:
          dir: oc2api
          packages: .
          targets: ${{ matrix.target }}
          out-dir: dist/${{ matrix.target }}
          output: ${{ env.LIB_NAME }}
          flags: -ldflags=-s -w
          x-flags: main.version=${{ steps.meta.outputs.version }}

      - name: Package plugin
        run: |
          set -euo pipefail
          rm -f go-cross-bin.h oc2api/dist/*.h || true
          LIB=""
          for p in \
            "oc2api/dist/${{ matrix.target }}/${LIB_NAME}" \
            "dist/${{ matrix.target }}/${LIB_NAME}" \
            "oc2api/dist/${LIB_NAME}"; do
            if [ -f "$p" ]; then LIB="$p"; break; fi
          done
          if [ -z "$LIB" ]; then
            echo "library not found"; find . -name '*.dll' -o -name '*.so' | head
            exit 1
          fi
          go run ./.github/scripts/package-release.go \
            -library "${LIB}" \
            -archive "${ARCHIVE_NAME}" \
            -checksum "${ARCHIVE_NAME}.sha256"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARCHIVE_NAME }}
          path: |
            ${{ env.ARCHIVE_NAME }}
            ${{ env.ARCHIVE_NAME }}.sha256
          if-no-files-found: error

  release:
    name: Release
    # Only for a version tag, or a dispatch WITH a version.
    if: >-
      (github.event_name == 'workflow_dispatch' && github.event.inputs.version != '') ||
      startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - build-cross
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: meta
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            V="${{ github.event.inputs.version }}"
            TAG="v${V}"
          else
            V="${GITHUB_REF_NAME#v}"
            # Release under the exact tag that was pushed, so pushing v0.1.0
            # produces a v0.1.0 release (what the official plugin store reads).
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Releasing ${TAG} (version $V)"

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Assemble checksums.txt
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p out
          mv dist/oc2api_${VERSION}_*.zip* out/ 2>/dev/null || true
          ls -la out/
          if ls out/*.sha256 >/dev/null 2>&1; then
            sort out/*.sha256 > out/checksums.txt
          else
            (cd out && sha256sum *.zip > checksums.txt)
          fi
          cat out/checksums.txt
          # Every platform the host can ask for must be present.
          for t in linux_amd64 linux_arm64 darwin_amd64 darwin_arm64 windows_amd64 windows_arm64; do
            test -f "out/oc2api_${VERSION}_${t}.zip" || { echo "missing oc2api_${VERSION}_${t}.zip"; exit 1; }
          done

      - name: Stamp registry.json with the released version
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, pathlib
          v = os.environ["VERSION"]
          p = pathlib.Path("registry.json")
          data = json.loads(p.read_text())
          for plug in data.get("plugins", []):
              if plug.get("id") == "oc2api":
                  plug["version"] = v
                  plug["release_tag"] = f"v{v}"
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n")
          print(p.read_text())
          PY
          python3 .github/scripts/validate-registry.py registry.json
          # The release carries this file as an asset too, because the workflow
          # cannot commit the bump back to the branch. A host that points its
          # store-source at the release always sees the right version.
          cp registry.json out/registry.json

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" != "tag" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if ! git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              git tag -a "${TAG}" -m "Release oc2api plugin v${VERSION}"
              git push origin "${TAG}"
            fi
          fi
          NOTES=$(cat <<EOF
          ## oc2api CLIProxyAPI plugin v${VERSION}

          OpenCode Zen free models for [CLIProxyAPI](https://github.com/router-for-me/CLIProxyAPI),
          as an external c-shared plugin — no extra server process, no extra HTTP hop.

          ### Assets (pluginstore \`ArchiveName(id, version, goos, goarch)\`)
          | File | Contents |
          |---|---|
          | \`oc2api_${VERSION}_linux_amd64.zip\` | \`oc2api.so\` |
          | \`oc2api_${VERSION}_linux_arm64.zip\` | \`oc2api.so\` |
          | \`oc2api_${VERSION}_darwin_amd64.zip\` | \`oc2api.dylib\` |
          | \`oc2api_${VERSION}_darwin_arm64.zip\` | \`oc2api.dylib\` |
          | \`oc2api_${VERSION}_windows_amd64.zip\` | \`oc2api.dll\` |
          | \`oc2api_${VERSION}_windows_arm64.zip\` | \`oc2api.dll\` |
          | \`checksums.txt\` | SHA-256 of the zips |
          | \`registry.json\` | plugin-source manifest for this version |

          ### Install via plugin source
          \`\`\`
          ${REPO_URL}/releases/latest/download/registry.json
          \`\`\`

          ### Manual install (linux/amd64)
          \`\`\`bash
          unzip oc2api_${VERSION}_linux_amd64.zip
          cp oc2api.so /path/to/cliproxyapi/plugins/oc2api.so
          \`\`\`
          EOF
          )
          if gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG}" out/*.zip out/checksums.txt out/registry.json --clobber --repo "${GITHUB_REPOSITORY}"
          else
            gh release create "${TAG}" out/*.zip out/checksums.txt out/registry.json \
              --repo "${GITHUB_REPOSITORY}" \
              --title "oc2api plugin v${VERSION}" \
              --notes "${NOTES}"
          fi
